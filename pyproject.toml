[project]
name = "speedmeter"
version = "1.0.0"
description = "Measure internet download speed by fetching a URL several times in a row"
readme = "README.md"
authors = [{ name = "Дмитрий", email = "dzmitryholas373@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PT", "RUF", "ASYNC"]
# Комментарии на русском: кириллица не считается опечаткой в латинице.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
